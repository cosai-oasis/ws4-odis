# OpenShell gateway for the ODIS contract harness OpenShell-gated demo.
#
# Runs entirely from the PUBLISHED image — no OpenShell source checkout required:
#
#   docker compose up -d
#   mise run openshell-connect   # register/select; status -> Connected
#
# Sandbox containers are created/managed by the gateway (Docker-outside-of-Docker via
# the mounted docker.sock), not by this Compose file. All gateway/driver settings live
# in gateway.toml beside this file.

services:
  gateway:
    image: ghcr.io/nvidia/openshell/gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Clear the image's default CMD so gateway.toml owns all settings.
    command: []
    # DooD (Docker-outside-of-Docker): the gateway uses the host docker.sock to create
    # sibling sandbox containers. UID 0 is for local dev (docker.sock access + writing the
    # extracted supervisor binary); production should use a dedicated non-root uid.
    user: "0"
    # Linux: host.docker.internal / host.openshell.internal are not auto-added. The
    # sandbox->gateway callback (grpc_endpoint in gateway.toml) needs them.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.openshell.internal:host-gateway"
    ports:
      # Keep the unauthenticated local-dev control plane off external interfaces.
      # 8080 is hard-wired here on purpose (not parameterized): the sandbox->gateway
      # callback dials host.openshell.internal:<gateway bind port>, so the published
      # host port, the internal bind port, and gateway.toml's grpc_endpoint must all
      # agree. Changing only the published port strands sandbox provisioning in a
      # restart loop (callbacks hit whatever else owns host:8080). To move it you must
      # change all three together (command `--port`, this mapping, grpc_endpoint); for
      # the demo that's not worth exposing, so setup.sh instead fails fast when 8080
      # is already taken.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:${OPENSHELL_HEALTH_PORT:-8081}:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Data dir must bind-mount source==target so the extracted supervisor binary path
      # resolves on both host and container when the driver creates sandbox containers.
      - type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
      - type: bind
        source: ./gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true
      # Sandbox JWT signing material (referenced by gateway.toml [openshell.gateway.gateway_jwt]).
      # Generated by setup.sh; gitignored — jwt-signing.pem is a private key.
      - { type: bind, source: ./jwt-signing.pem, target: /etc/openshell/jwt-signing.pem, read_only: true }
      - { type: bind, source: ./jwt-public.pem, target: /etc/openshell/jwt-public.pem, read_only: true }
      - { type: bind, source: ./jwt-kid, target: /etc/openshell/jwt-kid, read_only: true }
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      # DB URL is kept out of the TOML (which blocks credential-bearing URLs from VCS).
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
