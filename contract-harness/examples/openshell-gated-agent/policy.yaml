# OpenShell sandbox network policy for the ODIS-gated agent.
#
# OpenShell is default-deny outbound, at two layers. A proxy-mediated request to a host
# not named below gets a 403 on CONNECT; a socket that bypasses the proxy entirely is
# refused at connect time by the sandbox netns's nftables chain. This policy authorizes the
# agent's ONE sanctioned egress — the ODIS Router — and nothing else. The agent
# therefore CANNOT reach the vendor MCP server, provider APIs, or the internet
# directly; its only path to a tool is through the Router, which makes the
# Router's policy gate *enforcing* rather than advisory.
#
# The two layers enforce different things, which is the point of the demo. OpenShell
# understands MCP natively (`protocol: mcp` parses the JSON-RPC envelope and can gate on
# method and tool name) but not tool ARGUMENTS. So this policy allows the whole MCP method
# surface and leaves the fine-grained decision to the Router: signed grant, OPA decision,
# and argument-level action limits, after OpenShell has forced the path.
#
# host.openshell.internal is injected into the sandbox by the OpenShell Docker driver and
# resolves to the host (the docker-bridge gateway IP). The Router must `serve` bound to
# 0.0.0.0 on the host so the sandbox can reach it there — binding 127.0.0.1 would be
# unreachable from the sandbox container.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  odis_router:
    name: odis-router-only
    endpoints:
      # The ONLY host the agent may reach. Everything else is default-denied,
      # including the vendor MCP server and any provider/credential endpoint.
      - host: host.openshell.internal
        port: 8088
        # No `path` scope. The Router mounts at /mcp, but Starlette's Mount normalizes the
        # request to `/mcp/` with a trailing slash, and a `path: /mcp` glob does not match
        # it, so a path-scoped rule refuses every call at the proxy before it reaches
        # the Router. Host and
        # port are the scope that matters here anyway.
        protocol: mcp
        enforcement: enforce
        # `access` presets are rejected on `protocol: mcp` — HTTP method/path presets
        # cannot authorize JSON-RPC safely, since every MCP call is a POST. The method
        # profile is the sanctioned way to say "the whole MCP surface".
        mcp:
          allow_all_known_mcp_methods: true
        rules:
          - allow: {}
    binaries:
      # The agent process — the python in the base sandbox image's venv (see sandbox/Dockerfile).
      - { path: /sandbox/.venv/bin/python3 }
