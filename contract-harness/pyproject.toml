[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odis-contract-harness"
version = "0.0.0"
description = "ODIS Contract Harness — a runnable prototype of the Passport / Bridge / Router contract surfaces, with APF-shaped policy + audit at the Router boundary"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Gladney", email = "mgladney@nvidia.com" }]

dependencies = [
    "anyio>=4.13.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0.2",
    "structlog>=25.1",
    # Capped below 2. `mcp_forwarder` imports the SDK's auth internals
    # (`server.auth.middleware.bearer_auth`, `server.auth.provider`), and 2.x already
    # renames client symbols the example agent uses — a floor alone resolves a major
    # that does not fit. Raise the cap deliberately, with the migration.
    "mcp>=1.27.1,<2",
    "cryptography>=48.0.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic>=2.0",
    "httpx>=0.28.1",
    "starlette>=1.2.0",
    "typer>=0.12",
    "uvicorn>=0.48.0",
]

[project.scripts]
odis-harness = "odis_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.19.0",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odis_harness"]

# -- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -ra --disable-socket"
markers = [
    "requires_opa: tests that call the real `opa` binary; skipped if not on PATH",
    "requires_vault: tests that boot a dev-mode `vault` binary; skipped if ODIS_VAULT_BIN/./vault absent",
]

# -- mypy --------------------------------------------------------------------

[tool.mypy]
strict = true
# Pin to the lowest supported version so we catch syntax/stdlib usage
# that would break the 3.11 row of the CI matrix.
python_version = "3.11"
files = ["src/odis_harness"]
exclude = ["tests/"]

# -- ruff --------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstring rules (opt-in per team)
    "COM812",  # trailing comma (formatter handles)
    "ISC001",  # implicit string concat (formatter handles)
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "T201",   # demo scripts narrate to stdout; the sandboxed agent's prints ARE its output channel
    "INP001", # standalone example scripts, not a package
]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "S105",    # fixture token literals; naming them *_TOKEN is what makes the test readable
    "S106",    # hardcoded passwords in fixtures
    "ANN",     # type annotations relaxed in tests
    "ARG",     # unused args (fixtures)
    "PLR2004", # magic numbers in test data
]
# Pinned to the two modules that declare Typer command signatures. A package-wide glob
# would also relieve `builders.py`, which is ordinary library code and should keep the
# boolean-trap and argument-count rules. The `Annotated` form removes the need for B008
# and FBT003; only what is inherent to Typer's model remains.
"src/odis_harness/cli/serve.py" = [
    "FBT001",  # bool option params are Typer flags, never positional
    "FBT002",  # ... and their default belongs in the signature in the Annotated form
    "PLR0913", # Typer maps each CLI option to a command parameter (the serve surface)
]
"src/odis_harness/cli/demo.py" = [
    "FBT001",  # bool option params are Typer flags, never positional
    "FBT002",  # ... and their default belongs in the signature in the Annotated form
    "PLR0913", # Typer maps each CLI option to a command parameter (the serve surface)
]

[tool.ruff.format]
quote-style = "double"
